name: Compile

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install metanorma
        run: gem install metanorma metanorma-iso
      - name: Where did the gems go
        run: |
          gem env | sed -n '1,12p'
          find "$HOME" /opt/hostedtoolcache -maxdepth 6 -name metanorma -type f 2>/dev/null | head
      - name: Compile the standard
        run: |
          BINDIR="$HOME/.gem/ruby/$(ruby -e 'puts RbConfig::CONFIG["ruby_version"]')/bin"
          test -x "$BINDIR/metanorma"
          cd spec/signatif-standard
          "$BINDIR/metanorma" document.adoc
      - name: Check the outputs exist
        run: |
          test -s spec/signatif-standard/document.html
          test -s spec/signatif-standard/document.xml
          test -s spec/signatif-standard/document.pdf
