name: Compile

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install metanorma
        run: gem install metanorma metanorma-iso
      - name: Compile the standard
        env:
          MN: ${{ runner.temp }}/mn
        run: |
          MN_BIN="$(ruby -e 'puts Gem.bindir')/metanorma"
          cd spec/signatif-standard
          "$MN_BIN" document.adoc
      - name: Check the outputs exist
        run: |
          test -s spec/signatif-standard/document.html
          test -s spec/signatif-standard/document.xml
          test -s spec/signatif-standard/document.pdf
