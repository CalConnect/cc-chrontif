# yaml-language-server: $schema=./schema-cc.yaml
---
groups:
- scopes:
  - title: Algorithm agility conformance
    name: Algorithm agility conformance
    identifier: /conf/algorithm-agility
    target: /req/algorithm-agility
    subject: algorithm agility
    description: Conformance tests for algorithm agility requirements.
    dependencies:
    - /conf/algorithms
    guidance:
    tests:

    - name: Algorithm registry validation
      identifier_fragment: algorithm-registry
      targets:
      - /req/algorithm-agility/algorithm-registry
      purpose: Verify the algorithm registry is maintained and used.
      method: Inspect the registry and verify it lists recognized algorithms with names,
        references, parameters, and status. Verify conforming verifiers accept registered
        identifiers and reject unregistered ones.
      type: Validation

    - name: Deprecation process test
      identifier_fragment: deprecation-process
      targets:
      - /req/algorithm-agility/deprecation-process
      purpose: Verify the deprecation process is followed correctly.
      method: Deprecate an algorithm following the published process. Verify artifacts using
        the deprecated algorithm are downgraded during the deprecation period. Verify they
        are rejected after retirement.
      type: Conformance

    - name: Migration phase declaration validation
      identifier_fragment: migration-declaration
      targets:
      - /req/algorithm-agility/migration-declaration
      purpose: Verify deployments declare their migration phase.
      method: Inspect deployment manifests and verify they declare active algorithms and
        migration phase (classical-only, composite, or post-quantum-only).
      type: Validation

    - name: Archive validation test
      identifier_fragment: archive-validation
      targets:
      - /req/algorithm-agility/archive-validation
      purpose: Verify retired-algorithm artifacts with contemporaneous evidence verify under the archive label.
      method: Construct an artifact signed with a deprecated-then-retired algorithm carrying
        a contemporaneous time attestation and transparency inclusion proof. Verify it
        classifies under the scheme's archive label rather than being rejected outright.
      type: Conformance
    - name: Circulation migration path test
      identifier_fragment: reissuance-path
      targets:
      - /req/algorithm-agility/reissuance-path
      purpose: Verify the deprecation process provides a migration path before retirement.
      method: Inspect the published deprecation process. Verify it defines re-issuance,
        re-signing, or archival classification for artifacts still in circulation, and that
        the path is available throughout the deprecation window.
      type: Conformance

    - name: Composite backward compatibility test
      identifier_fragment: composite-backward-compatibility
      targets:
      - /req/algorithm-agility/composite-backward-compatibility
      purpose: Verify composite phase maintains backward compatibility.
      method: Configure a deployment in composite phase. Verify new artifacts use composite
        signatures. Verify existing classical-only artifacts remain verifiable. Configure
        post-quantum-only phase and verify classical-only signatures are rejected.
      type: Conformance
