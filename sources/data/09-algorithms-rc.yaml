# yaml-language-server: $schema=./schema-rc.yaml
---
groups:
- scopes:
  - title: Cryptographic algorithms
    name: Cryptographic algorithms
    identifier: /req/algorithms
    subject: cryptographic algorithms
    description: Requirements on classical and post-quantum signature algorithms, composite signatures, post-quantum migration, algorithm agility, and encryption at rest.
    dependencies:
    - /req/artifact-format
    guidance:

    requirements:
    - name: Classical algorithm recognition
      identifier_fragment: classical-algorithms
      statement: The framework shall recognize classical signature algorithms registered
        in the algorithm identifier registry (<<annex-c>>).
      guidance:
      - Additional classical algorithms may be registered per the registration policy.
      examples:
      - ECDSA with P-256 and Ed25519 are examples of initially registered classical
        algorithms.
      - SM2 is an example of a national standard algorithm registrable under the same
        policy.

    - name: Post-quantum algorithm recognition
      identifier_fragment: post-quantum-algorithms
      statement: The framework shall recognize post-quantum signature algorithms registered
        in the algorithm identifier registry (<<annex-c>>).
      guidance:
      - Additional post-quantum algorithms may be registered per the registration policy.
      examples:
      - ML-DSA per FIPS 204 and SLH-DSA per FIPS 205 are examples of initially registered
        post-quantum algorithms.

    - name: Composite signature AND semantics
      identifier_fragment: composite-and-semantics
      statement: A composite signature shall be the AND-composition of two or more signature
        algorithms over the same canonical payload under a composite algorithm identifier
        that binds the component public keys and domain-separates the composite from its
        components; all component signatures shall verify for the composite to be valid,
        and a component signature shall not be valid as a standalone signature on the
        artifact.
      guidance:
      - The primary use case for composite signatures is combining a classical algorithm
        with a post-quantum algorithm for transition security during post-quantum migration.
      - Compositions of two post-quantum algorithms or other multi-algorithm combinations
        are also permitted.

    - name: Post-quantum migration phases
      identifier_fragment: migration-phases
      statement: The framework shall support a migration path from classical-only through
        composite to post-quantum-only signatures, governed by the algorithm agility
        framework.
      guidance:
      - Each phase is a deployment policy decision; the framework supports all three.

    - name: Algorithm agility identifiers
      identifier_fragment: algorithm-agility-identifiers
      statement: Each algorithm shall carry an explicit identifier in the signature wrapper,
        and verifiers shall use this identifier to select the validation method and determine
        support.
      guidance:
      - Deprecated algorithms shall be announced in advance.

    - name: Encryption at rest
      identifier_fragment: encryption-at-rest
      statement: Private keys and sensitive data at rest shall be encrypted using an authenticated
        encryption algorithm meeting the minimum security parameters in
        <<tab-security-parameters>>, with the encryption key derived
        using a password-based key derivation function resistant to brute-force attacks.
      guidance:
      - The choice of specific encryption and key derivation algorithms is an implementation
        decision.
      - AES-256-GCM and PBKDF2 are examples of suitable algorithms; ChaCha20-Poly1305,
        Argon2, scrypt, and other algorithms with equivalent or greater security strength
        are also acceptable.

    - name: Minimum security parameters
      identifier_fragment: minimum-security-parameters
      statement: Conforming implementations shall use algorithms and parameters providing a
        minimum security strength of 128 bits, and shall not generate or accept keys,
        signatures, or hashes below this minimum.
      guidance:
      - For long-term security (artifact validity exceeding 10 years), a minimum of 192 bits
        is recommended.
      - SHA-1 and MD5 are prohibited. Random number generators shall conform to a recognized
        standard.
