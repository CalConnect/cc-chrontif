<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="snarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="450" y="25" text-anchor="middle" font-size="15" font-weight="bold">Monotonic scope narrowing — S₀ ⊇ S₁ ⊇ S₂ ⊇ S₃</text>
  <text x="450" y="44" text-anchor="middle" font-size="12" fill="#666">Each delegation narrows scope; widening at any link is a hard verification failure</text>

  <!-- Level 0: RTA -->
  <rect x="50" y="70" width="800" height="55" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="450" y="90" text-anchor="middle" font-weight="bold">S₀ (Root Trust Authority)</text>
  <text x="450" y="108" text-anchor="middle" font-size="11" fill="#555">domain: *  |  subdomain: *  |  class: *  |  instance: *  |  identity: *</text>
  <text x="450" y="120" text-anchor="middle" font-size="10" fill="#888">Wildcard on all dimensions — broadest possible scope</text>

  <!-- Arrow down -->
  <line x1="450" y1="125" x2="450" y2="155" stroke="#555" stroke-width="2" marker-end="url(#snarr)"/>
  <text x="465" y="145" font-size="11" fill="#34a853">delegates ↓ (narrows domain)</text>

  <!-- Level 1: DTA_A -->
  <rect x="100" y="160" width="700" height="55" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="450" y="180" text-anchor="middle" font-weight="bold">S₁ (Delegated Trust Authority — Issuing)</text>
  <text x="450" y="198" text-anchor="middle" font-size="11" fill="#555">domain: metrology  |  subdomain: *  |  class: *  |  instance: *  |  identity: *</text>
  <text x="450" y="210" text-anchor="middle" font-size="10" fill="#888">Domain narrowed to metrology; all other dimensions still wildcard</text>

  <!-- Arrow down -->
  <line x1="450" y1="215" x2="450" y2="245" stroke="#555" stroke-width="2" marker-end="url(#snarr)"/>
  <text x="465" y="235" font-size="11" fill="#34a853">delegates ↓ (narrows subdomain + class)</text>

  <!-- Level 2: DTA_B -->
  <rect x="150" y="250" width="600" height="55" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="450" y="270" text-anchor="middle" font-weight="bold">S₂ (Delegated Trust Authority — Testing Lab)</text>
  <text x="450" y="288" text-anchor="middle" font-size="11" fill="#555">domain: metrology  |  subdomain: weighing  |  class: {NAWI, load cell}  |  instance: *  |  identity: *</text>
  <text x="450" y="300" text-anchor="middle" font-size="10" fill="#888">Subdomain and class narrowed; instance and identity still wildcard</text>

  <!-- Arrow down -->
  <line x1="450" y1="305" x2="450" y2="335" stroke="#555" stroke-width="2" marker-end="url(#snarr)"/>
  <text x="465" y="325" font-size="11" fill="#34a853">issues ↓ (narrows instance + identity)</text>

  <!-- Level 3: End Cert -->
  <rect x="200" y="340" width="500" height="55" rx="6" fill="#fef7e0" stroke="#fbbc04" stroke-width="2"/>
  <text x="450" y="360" text-anchor="middle" font-weight="bold">S₃ (End Certificate — Device Key)</text>
  <text x="450" y="378" text-anchor="middle" font-size="11" fill="#555">domain: metrology  |  subdomain: weighing  |  class: NAI  |  instance: LC-500  |  identity: SN-001</text>
  <text x="450" y="390" text-anchor="middle" font-size="10" fill="#888">Fully narrowed to a single device identity</text>

  <!-- Widening rejection -->
  <rect x="200" y="420" width="500" height="50" rx="6" fill="#fce8e6" stroke="#d32f2f" stroke-width="2"/>
  <text x="450" y="442" text-anchor="middle" font-weight="bold" fill="#d32f2f">WIDENING REJECTED</text>
  <text x="450" y="458" text-anchor="middle" font-size="11" fill="#d32f2f">e.g., identity: SN-001 → identity: * = hard verification failure</text>

  <!-- Error arrow -->
  <line x1="450" y1="395" x2="450" y2="420" stroke="#d32f2f" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Four-layer enforcement note -->
  <text x="450" y="500" text-anchor="middle" font-weight="bold" font-size="13">Four-layer enforcement</text>
  <text x="80" y="520" font-size="11" fill="#555">① Certificate extension (signed)</text>
  <text x="330" y="520" font-size="11" fill="#555">② Chain verification (every link)</text>
  <text x="560" y="520" font-size="11" fill="#555">③ Pipeline (condition eval)</text>
  <text x="730" y="520" font-size="11" fill="#555">④ Transparency log (audit)</text>
</svg>
