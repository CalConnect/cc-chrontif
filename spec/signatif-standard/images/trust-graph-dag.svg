<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrCosig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9334e6"/>
    </marker>
  </defs>

  <text x="450" y="22" text-anchor="middle" font-size="15" font-weight="bold">Trust graph — DAG with threshold, federation, and cross-domain edges</text>

  <!-- RTA 1 (threshold) -->
  <rect x="100" y="45" width="200" height="55" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="200" y="65" text-anchor="middle" font-weight="bold">RTA₁ (Root Trust Authority)</text>
  <text x="200" y="82" text-anchor="middle" font-size="11">5-of-7 threshold</text>
  <text x="200" y="95" text-anchor="middle" font-size="10" fill="#666">Scope S₀ = {domain: *}</text>

  <!-- RTA 2 (threshold) -->
  <rect x="600" y="45" width="200" height="55" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="700" y="65" text-anchor="middle" font-weight="bold">RTA₂ (Root Trust Authority)</text>
  <text x="700" y="82" text-anchor="middle" font-size="11">3-of-5 threshold</text>
  <text x="700" y="95" text-anchor="middle" font-size="10" fill="#666">Independent hierarchy</text>

  <!-- DTA A (under RTA1) -->
  <rect x="40" y="175" width="170" height="50" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="125" y="195" text-anchor="middle" font-weight="bold">DTA_A (3-of-5)</text>
  <text x="125" y="212" text-anchor="middle" font-size="10" fill="#666">S₁ ⊂ S₀</text>

  <!-- DTA B (under RTA1) -->
  <rect x="230" y="175" width="170" height="50" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="315" y="195" text-anchor="middle" font-weight="bold">DTA_B (2-of-3)</text>
  <text x="315" y="212" text-anchor="middle" font-size="10" fill="#666">S₁ ⊂ S₀</text>

  <!-- DTA C (under RTA2) -->
  <rect x="500" y="175" width="170" height="50" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="585" y="195" text-anchor="middle" font-weight="bold">DTA_C (4-of-6)</text>
  <text x="585" y="212" text-anchor="middle" font-size="10" fill="#666">S₁ ⊂ S₀</text>

  <!-- DTA D (under RTA2) -->
  <rect x="690" y="175" width="170" height="50" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="775" y="195" text-anchor="middle" font-weight="bold">DTA_D (1-of-1)</text>
  <text x="775" y="212" text-anchor="middle" font-size="10" fill="#666">S₁ ⊂ S₀</text>

  <!-- FTA (spans both hierarchies) -->
  <rect x="330" y="175" width="160" height="50" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="410" y="195" text-anchor="middle" font-weight="bold">FTA (2-of-4)</text>
  <text x="410" y="212" text-anchor="middle" font-size="10" fill="#666">DTA_A + DTA_C + ...</text>

  <!-- Delegation arrows from RTA1 -->
  <line x1="160" y1="100" x2="125" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="240" y1="100" x2="315" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Delegation arrows from RTA2 -->
  <line x1="660" y1="100" x2="585" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="740" y1="100" x2="775" y2="175" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- FTA membership edges (dashed) -->
  <line x1="195" y1="200" x2="335" y2="200" stroke="#ea4335" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="505" y1="200" x2="585" y2="200" stroke="#ea4335" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- End Certificates -->
  <rect x="60" y="300" width="140" height="45" rx="5" fill="#fef7e0" stroke="#fbbc04" stroke-width="1.5"/>
  <text x="130" y="320" text-anchor="middle" font-weight="bold">End Cert₁</text>
  <text x="130" y="335" text-anchor="middle" font-size="10" fill="#666">S₂ ⊂ S₁, 1-of-1 key</text>

  <rect x="250" y="300" width="140" height="45" rx="5" fill="#fef7e0" stroke="#fbbc04" stroke-width="1.5"/>
  <text x="320" y="320" text-anchor="middle" font-weight="bold">End Cert₂</text>
  <text x="320" y="335" text-anchor="middle" font-size="10" fill="#666">S₂ ⊂ S₁, 1-of-1 key</text>

  <rect x="520" y="300" width="140" height="45" rx="5" fill="#fef7e0" stroke="#fbbc04" stroke-width="1.5"/>
  <text x="590" y="320" text-anchor="middle" font-weight="bold">End Cert₃</text>
  <text x="590" y="335" text-anchor="middle" font-size="10" fill="#666">S₂ ⊂ S₁, 1-of-1 key</text>

  <rect x="700" y="300" width="140" height="45" rx="5" fill="#fef7e0" stroke="#fbbc04" stroke-width="1.5"/>
  <text x="770" y="320" text-anchor="middle" font-weight="bold">End Cert₄</text>
  <text x="770" y="335" text-anchor="middle" font-size="10" fill="#666">FTA-delegated</text>

  <!-- End cert issuance arrows -->
  <line x1="125" y1="225" x2="130" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="300" y1="225" x2="320" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="585" y1="225" x2="590" y2="300" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="430" y1="225" x2="770" y2="300" stroke="#555" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr)"/>

  <!-- Trusted Artifacts -->
  <rect x="55" y="420" width="150" height="55" rx="5" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="130" y="442" text-anchor="middle" font-weight="bold">Trusted Artifact</text>
  <text x="130" y="457" text-anchor="middle" font-size="10">Primary sig + co-sigs</text>
  <text x="130" y="470" text-anchor="middle" font-size="10">Grade: A (cross-domain)</text>

  <rect x="515" y="420" width="150" height="55" rx="5" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="590" y="442" text-anchor="middle" font-weight="bold">Trusted Artifact</text>
  <text x="590" y="457" text-anchor="middle" font-size="10">Primary sig + co-sigs</text>
  <text x="590" y="470" text-anchor="middle" font-size="10">Grade: A+ (2 roots)</text>

  <!-- Signing arrows -->
  <line x1="130" y1="345" x2="130" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="345" x2="590" y2="420" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Cross-domain co-signature -->
  <path d="M 205 448 Q 360 390 515 448" fill="none" stroke="#9334e6" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrCosig)"/>
  <text x="360" y="385" text-anchor="middle" font-size="11" fill="#9334e6" font-weight="bold">Cross-domain co-signature</text>
  <text x="360" y="399" text-anchor="middle" font-size="10" fill="#9334e6">(trust fusion at artifact level)</text>

  <!-- Legend -->
  <text x="450" y="540" text-anchor="middle" font-weight="bold" font-size="13">Legend</text>
  <rect x="50" y="555" width="15" height="15" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="75" y="567">Root Trust Authority (threshold)</text>
  <rect x="290" y="555" width="15" height="15" fill="#e6f4ea" stroke="#34a853"/>
  <text x="315" y="567">Delegated Trust Authority</text>
  <rect x="520" y="555" width="15" height="15" fill="#fce8e6" stroke="#ea4335" stroke-dasharray="3,2"/>
  <text x="545" y="567">Federated Trust Authority</text>
  <rect x="50" y="580" width="15" height="15" fill="#fef7e0" stroke="#fbbc04"/>
  <text x="75" y="592">End Certificate</text>
  <rect x="290" y="580" width="15" height="15" fill="#f3e8fd" stroke="#9334e6"/>
  <text x="315" y="592">Trusted Artifact</text>

  <line x1="520" y1="587" x2="540" y2="587" stroke="#9334e6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="545" y="592">Cross-domain co-signature</text>

  <text x="50" y="625" font-size="11" fill="#555">Solid arrows: delegation/issuance. Dashed red: FTA membership. Dashed purple: co-signature.</text>
  <text x="50" y="642" font-size="11" fill="#555">Multiple paths exist from artifact to root anchors — the verifier finds all valid paths in the DAG.</text>
</svg>
